# Cloudflare Pages 项目配置（advanced mode：_worker.js 接管全部路由）。
#
# 为什么用 Pages 而不是 Workers（*.workers.dev）：
#   *.workers.dev 在中国大陆被 SNI 阻断，前端站点调用会 "Failed to fetch"；
#   *.pages.dev 走同一批 Cloudflare 边缘节点但未被阻断。详见 ../readme.md。
#
# 部署：deploy-worker.yml 在推送 worker/ 时自动执行
#   npx wrangler pages deploy . --project-name cdgame-api --branch main
# account_id 由 CI 的 CLOUDFLARE_ACCOUNT_ID 环境变量提供（Pages 配置不支持
# 在 wrangler.toml 内写 account_id）。

name = "cdgame-api"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

# D1 数据库绑定（_worker.js 通过 env.DB 访问）
[[d1_databases]]
binding = "DB"
database_name = "cdgame"
database_id = "4f892d1e-f902-4a19-b229-365bae6d3c48"

# 跨域：站点地址（GitHub Pages）
[vars]
CORS_ORIGIN = "https://chuanshu1996.github.io"
