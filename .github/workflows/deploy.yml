name: Deploy to GitHub Pages

# 推送到 main 即重新构建并部署 Pages。
# 管理员在线上编辑卡牌属性后，server.js 会把 hero-data.ts 自动 commit 回本仓库（AUTO_COMMIT=1），
# 从而触发本工作流，使线上站点同步最新数据。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdgame_simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Build (bake VUE_APP_API_BASE into static site)
        run: npm run build
        env:
          VUE_APP_API_BASE: ${{ vars.VUE_APP_API_BASE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cdgame_simulator/docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
