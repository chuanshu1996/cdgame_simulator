name: Deploy to GitHub Pages

# 推送到 main 即重新构建并部署 Pages（构建时把 VUE_APP_API_BASE 烤入静态站点）。
# 管理员在线上编辑卡牌属性后，sync-herodata.yml 工作流会定时/手动从 Cloudflare D1 导出
# 写回 cdgame_simulator/core/fixtures/hero-data.ts 并推送，从而触发本工作流重建 Pages。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdgame_simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Build (bake VUE_APP_API_BASE into static site)
        run: npm run build
        env:
          VUE_APP_API_BASE: ${{ vars.VUE_APP_API_BASE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # 必须是 cdgame_simulator/docs：vue.config.js 的 outputDir 为 'docs'，
          # 相对的是项目根 cdgame_simulator/，产物落在 cdgame_simulator/docs。
          # 注意 upload-pages-artifact 的 path 解析基于仓库根（GITHUB_WORKSPACE），
          # 不受 job 的 defaults.run.working-directory 影响，写 'docs' 会上传仓库根的旧产物。
          path: cdgame_simulator/docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
